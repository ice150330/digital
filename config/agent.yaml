# Agent / Copilot（默认 pi 编排中枢；stub/未安装自动降级 local 并在响应标注）

runtime: pi  # pi | local | template

llm:
  # Key 仅环境变量或本地 .env，例如 DEEPSEEK_API_KEY / OPENAI_API_KEY
  base_url: ""  # 空则使用 provider 默认地址
  model: deepseek-chat
  timeout_sec: 60

pi:
  # 仅项目内路径；禁止 PATH / which pi
  executable: tools/pi-cli/node_modules/.bin/pi
  # Windows 可能为 .cmd，由 runtime 解析
  skills_dir: src/digital_marketing/agent/skills
  session_dir: outputs/agent_sessions
  timeout_sec: 180
  bridge_model: deepseek/deepseek-chat

audit:
  log_dir: outputs/agent_logs
  session_dir: outputs/agent_sessions

tools:
  whitelist:
    - get_dataset_profile
    - get_data_quality_issues
    - conversion_by_dimension
    - get_model_metrics
    - get_feature_schema
    - predict_proba
    - explain_global
    - explain_customer
    - segment_summary
    - assign_cluster
    - top_association_rules
    - strategy_brief
    # 阶段9 新增
    - compare_experiments
    - get_calibration_summary
    - get_lift_table
    - simulate_budget
    - counterfactual_explain
    - generate_analysis_report
    # Stage4 声明式图表工具
    - render_chart
